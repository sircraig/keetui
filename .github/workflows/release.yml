# Release when the version in Cargo.toml changes on main:
#
#   1. bump `version` in Cargo.toml, merge into main and push
#   2. the checks run, then the publish job waits for approval in the
#      Actions tab (the crates-io environment requires a reviewer)
#   3. once approved, it publishes to crates.io and tags the commit v<version>
#
# A version that already has a tag is never released again.
name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once; don't cancel one that is publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: new version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version is already tagged; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: fmt, clippy, test
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - run: rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: builds on rust-version
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with rust-version in Cargo.toml.
      - run: rustup toolchain install 1.89 --profile minimal --no-self-update
      - run: cargo +1.89 check --all-targets --locked

  publish:
    name: publish v${{ needs.version.outputs.version }}
    needs: [version, check, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits here for approval; the token is only released to approved runs
    # from main.
    environment: crates-io
    permissions:
      contents: write # to create the tag
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      # Each step skips what is already done, so a failed run can be re-run.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "keetui release (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/keetui/$VERSION")
          case $status in
            200) echo "keetui $VERSION is already on crates.io" ;;
            404) cargo publish --locked ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - name: Tag v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "v$VERSION is already tagged"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" --silent
          fi
