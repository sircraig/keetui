[package]
name = "keetui"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "A KeePass-compatible TUI password manager"
license = "MIT"
repository = "https://github.com/sircraig/keetui"

[dependencies]
ratatui = "0.30"
keepass = { version = "0.15.0", features = ["save_kdbx4", "totp"] }
clap = { version = "4", features = ["derive"] }
zeroize = "1"
rand = "0.9"
anyhow = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
signal-hook = "0.3"
base32 = "0.5"
form_urlencoded = "1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }

# Argon2 is very slow unoptimized: without this, a few key-derivation tests
# dominate `cargo test`, and debug builds take seconds to unlock or save.
[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.blake2b_simd]
opt-level = 3

[profile.release]
strip = true
lto = true
